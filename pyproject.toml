[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "building-ai-desktop"
version = "1.2.0"
description = "AI-assisted building energy and HVAC operational data analysis platform"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["building_ai*"]

[tool.setuptools.package-data]
"building_ai.ui" = ["model_viewer_assets/*.html", "model_viewer_assets/*.js", "model_viewer_assets/*.txt"]
